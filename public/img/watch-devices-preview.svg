    <circle cx="66" cy="59" r="26" fill="none" stroke="#c8a44e" stroke-width="2.4"/>
    <path d="M54 60 L63 69 L80 48" fill="none" stroke="#c8a44e" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
