<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="720" height="1280" role="img" aria-label="BodyBank connects Whoop, Fitbit, Amazfit, Polar, Samsung, Oura, Garmin, Apple Watch, Google Health Connect and more into one platform">
  <defs>
    <linearGradient id="wdBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/><stop offset="0.5" stop-color="#060606"/><stop offset="1" stop-color="#0b0906"/>
    </linearGradient>
    <linearGradient id="wdGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0c478"/><stop offset="0.5" stop-color="#c8a44e"/><stop offset="1" stop-color="#a68c3e"/>
    </linearGradient>
    <radialGradient id="wdCore" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c8a44e" stop-opacity="0.42"/><stop offset="0.6" stop-color="#c8a44e" stop-opacity="0.12"/><stop offset="1" stop-color="#c8a44e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .h{font-family:Bebas Neue,Oswald,Arial Narrow,sans-serif;letter-spacing:2px}
    .s{font-family:Outfit,Segoe UI,Helvetica,Arial,sans-serif}
    .nd{font-size:15px;font-weight:700;letter-spacing:1.1px;fill:#f2ece0}
  </style>

  <rect width="720" height="1280" rx="34" fill="url(#wdBg)"/>
  <rect x="1" y="1" width="718" height="1278" rx="33" fill="none" stroke="#c8a44e" stroke-opacity="0.22"/>

  <text class="h" x="360" y="132" font-size="46" text-anchor="middle" fill="#f2ece0">YOUR HEALTH DATA,</text>
  <text class="h" x="360" y="182" font-size="46" text-anchor="middle" fill="#c8a44e">NOW TRULY CONNECTED.</text>
  <line x1="150" y1="216" x2="290" y2="216" stroke="#c8a44e" stroke-opacity="0.4"/>
  <text class="s" x="360" y="222" font-size="17" text-anchor="middle" fill="#bfb9ab">One platform. All your health insights.</text>
  <line x1="430" y1="216" x2="570" y2="216" stroke="#c8a44e" stroke-opacity="0.4"/>

  <circle cx="360" cy="690" r="300" fill="url(#wdCore)"/>
  <circle cx="360" cy="690" r="248" fill="none" stroke="#c8a44e" stroke-opacity="0.16" stroke-dasharray="2 9"/>
  <circle cx="360" cy="690" r="168" fill="none" stroke="#c8a44e" stroke-opacity="0.1" stroke-dasharray="2 9"/>

  <g stroke="#c8a44e" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round">
    <line x1="360" y1="690" x2="360" y2="442"/>
    <line x1="360" y1="690" x2="506" y2="489"/>
    <line x1="360" y1="690" x2="596" y2="613"/>
    <line x1="360" y1="690" x2="596" y2="767"/>
    <line x1="360" y1="690" x2="506" y2="891"/>
    <line x1="360" y1="690" x2="360" y2="938"/>
    <line x1="360" y1="690" x2="214" y2="891"/>
    <line x1="360" y1="690" x2="124" y2="767"/>
    <line x1="360" y1="690" x2="124" y2="613"/>
    <line x1="360" y1="690" x2="214" y2="489"/>
  </g>

  <g>
