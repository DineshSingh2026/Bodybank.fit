    <g transform="translate(506,489)">
      <circle r="58" fill="#0f0f0f" stroke="#c8a44e" stroke-opacity="0.55" stroke-width="2"/>
      <rect x="-15" y="-30" width="30" height="30" rx="9" fill="none" stroke="#e0c478" stroke-width="2.4"/>
      <path d="M-9 -30 L-9 -37 M9 -30 L9 -37 M-9 0 L-9 7 M9 0 L9 7" stroke="#e0c478" stroke-width="2.4" stroke-linecap="round"/>
