      <circle cy="-15" r="16" fill="none" stroke="#e0c478" stroke-width="2.4"/>
      <path d="M-16 -15 L-23 -15 M16 -15 L23 -15" stroke="#e0c478" stroke-width="2.4" stroke-linecap="round"/>
      <text class="s nd" y="30" text-anchor="middle">AMAZFIT</text>
    </g>
    <g transform="translate(596,767)">
      <circle r="58" fill="#0f0f0f" stroke="#c8a44e" stroke-opacity="0.55" stroke-width="2"/>
      <circle cy="-15" r="16" fill="none" stroke="#e0c478" stroke-width="2.4"/>
      <path d="M-16 -15 L-23 -15 M16 -15 L23 -15" stroke="#e0c478" stroke-width="2.4" stroke-linecap="round"/>
      <text class="s nd" y="30" text-anchor="middle">POLAR</text>
    </g>
    <g transform="translate(506,891)">
      <circle r="58" fill="#0f0f0f" stroke="#c8a44e" stroke-opacity="0.55" stroke-width="2"/>
      <circle cy="-15" r="16" fill="none" stroke="#e0c478" stroke-width="2.4"/>
      <path d="M-16 -15 L-23 -15 M16 -15 L23 -15" stroke="#e0c478" stroke-width="2.4" stroke-linecap="round"/>
      <text class="s nd" y="30" text-anchor="middle">SAMSUNG</text>
