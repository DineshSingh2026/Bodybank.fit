      <circle cy="-15" r="16" fill="none" stroke="#e0c478" stroke-width="2.4"/>
      <path d="M-16 -15 L-23 -15 M16 -15 L23 -15" stroke="#e0c478" stroke-width="2.4" stroke-linecap="round"/>
      <text class="s nd" y="30" text-anchor="middle">GARMIN</text>
    </g>
    <g transform="translate(124,613)">
      <circle r="58" fill="#0f0f0f" stroke="#c8a44e" stroke-opacity="0.55" stroke-width="2"/>
      <rect x="-15" y="-31" width="30" height="32" rx="10" fill="none" stroke="#e0c478" stroke-width="2.4"/>
      <path d="M-9 -31 L-9 -38 M9 -31 L9 -38 M-9 1 L-9 8 M9 1 L9 8" stroke="#e0c478" stroke-width="2.4" stroke-linecap="round"/>
      <text class="s nd" y="30" text-anchor="middle">APPLE</text>
    </g>
    <g transform="translate(214,489)">
      <circle r="58" fill="#0f0f0f" stroke="#c8a44e" stroke-opacity="0.55" stroke-width="2"/>
      <path d="M-18 -15 L-8 -15 L-3 -26 L3 -4 L8 -15 L18 -15" fill="none" stroke="#e0c478" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
