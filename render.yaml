# Render Blueprint — BodyBank
# Add a PostgreSQL database (Render Postgres) and set DATABASE_URL in environment variables.

services:
  - type: web
    name: bodybank-fit
    env: node
    # The branded blood/health report PDF is now pure Node (services/healthReportPdfKit.js
    # via PDFKit) — no Python/ReportLab to provision.
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
